[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-eval-benchmark-harness"
version = "2.0.0"
description = "AgentEval-Harness: Multi-Dimensional Autonomous Task Evaluation Suite"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
automated-eval-benchmark-harness = "agent_eval_harness.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/automated-eval-benchmark-harness"
Repository = "https://github.com/abusuraihsakhri/automated-eval-benchmark-harness.git"
